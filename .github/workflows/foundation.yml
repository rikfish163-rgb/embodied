name: foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.9.21
          python-version: "3.12"
          enable-cache: true

      - name: Install foundation dependencies
        run: uv sync --locked --group test

      - name: Run deterministic foundation check
        run: uv run python scripts/check_foundation.py

      - name: Run foundation tests
        run: uv run pytest tests -q

      - name: Check patch whitespace
        run: git diff-tree --check -r HEAD
