name: foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MUJOCO_GL: osmesa
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/.cache/pycache

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.21
          python-version: "3.12"
          enable-cache: true

      - name: Install headless MuJoCo renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libosmesa6

      - name: Install foundation dependencies
        run: uv sync --locked --group test

      - name: Run deterministic foundation check
        run: uv run --locked python scripts/check_foundation.py

      - name: Run foundation tests
        run: uv run --locked pytest tests -q

      - name: Run Ruff lint
        run: uv run --locked python -m ruff check --no-cache src tests scripts

      - name: Check patch whitespace
        run: git diff-tree --check -r HEAD
