[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-reactive-il"
version = "0.1.0"
description = "A reproducible MuJoCo Panda manipulation and reactive imitation-learning benchmark."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "h5py==3.16.0",
    "imageio==2.37.4",
    "mujoco==3.11.0",
    "numpy==2.5.2",
]

[project.urls]
Repository = "https://github.com/rikfish163-rgb/embodied"

[dependency-groups]
test = [
    "pytest==9.1.1",
    "ruff==0.15.10",
    "scipy==1.18.0",
]
video = [
    "imageio-ffmpeg==0.6.0",
]
train = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "safetensors==0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "env*", "evaluation*", "expert*", "policy*", "robotics*"]
exclude = ["robotics.tests*"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
